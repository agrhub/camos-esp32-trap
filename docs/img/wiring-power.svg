<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="36" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2833" text-anchor="start">Power: solar -&gt; charger -&gt; LiPo -&gt; rails</text>
<text x="24" y="60" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6672" text-anchor="start">BAT+ feeds the modem directly and the 3.3 V buck-boost for the camera board and the GPS. Kconfig: BATT_ADC_GPIO=1 (100k/100k), SOLAR_ADC_GPIO=2 (100k/33k).</text>
<line x1="24" y1="92" x2="52" y2="92" stroke="#e8590c" stroke-width="3"/>
<text x="58" y="96" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2833" text-anchor="start">solar input</text>
<line x1="174" y1="92" x2="202" y2="92" stroke="#d62828" stroke-width="3"/>
<text x="208" y="96" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2833" text-anchor="start">BAT+ (3.4-4.2 V)</text>
<line x1="324" y1="92" x2="352" y2="92" stroke="#f08c00" stroke-width="3"/>
<text x="358" y="96" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2833" text-anchor="start">3.3 V</text>
<line x1="474" y1="92" x2="502" y2="92" stroke="#222222" stroke-width="3"/>
<text x="508" y="96" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2833" text-anchor="start">GND</text>
<line x1="624" y1="92" x2="652" y2="92" stroke="#2b8a3e" stroke-width="3"/>
<text x="658" y="96" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2833" text-anchor="start">ADC sense</text>
<rect x="40" y="150" width="200" height="90" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
<text x="140.0" y="172" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">Solar panel</text>
<text x="140.0" y="190" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">6 V 2 W (136 x 110 mm)</text>
<rect x="320" y="140" width="230" height="110" rx="8" fill="#fff9db" stroke="#f08c00" stroke-width="1.6"/>
<text x="435.0" y="162" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">Charger</text>
<text x="435.0" y="180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">TP4056 + DW01 (protected)</text>
<text x="435.0" y="195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">or CN3791 MPPT for the panel</text>
<rect x="320" y="380" width="230" height="110" rx="8" fill="#fff5f5" stroke="#d62828" stroke-width="1.6"/>
<text x="435.0" y="402" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">LiPo 1S 2000 mAh</text>
<text x="435.0" y="420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">103450 pouch or 18650</text>
<text x="435.0" y="435" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">3.3-4.2 V</text>
<rect x="680" y="140" width="220" height="100" rx="8" fill="#fff9db" stroke="#f08c00" stroke-width="1.6"/>
<text x="790.0" y="162" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">3.3 V buck-boost</text>
<text x="790.0" y="180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">TPS63020: 1.8-5.5 V in</text>
<text x="790.0" y="195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">3.3 V up to 1.3 A</text>
<rect x="980" y="120" width="190" height="70" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/>
<text x="1075.0" y="142" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">Camera board 3V3</text>
<text x="1075.0" y="160" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">ESP32-S3 + OV5640</text>
<rect x="980" y="220" width="190" height="70" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="1075.0" y="242" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">GPS VCC</text>
<text x="1075.0" y="260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">through the AO3401 (GPIO21)</text>
<rect x="980" y="360" width="190" height="90" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="1075.0" y="382" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">A7680C VCC</text>
<text x="1075.0" y="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">3.8-4.2 V, peaks 2 A</text>
<text x="1075.0" y="415" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">1000 uF + 100 nF at the pins</text>
<polyline points="240,195 320,195" fill="none" stroke="#e8590c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="280.0" y="189.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e8590c" text-anchor="middle">IN+</text>
<polyline points="435,250 435,380" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="435.0" y="319.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d62828" text-anchor="middle">BAT+ / B-</text>
<polyline points="550,195 680,195" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="615.0" y="189.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d62828" text-anchor="middle">OUT+ (= BAT+)</text>
<polyline points="615,195 615,405 980,405" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="797.5" y="399.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d62828" text-anchor="middle">BAT+ (short, thick: 0.5 mm2)</text>
<circle cx="615" cy="195" r="4" fill="#d62828"/>
<polyline points="900,190 940,190 940,155 980,155" fill="none" stroke="#f08c00" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="920.0" y="184.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f08c00" text-anchor="middle">3.3 V</text>
<polyline points="940,190 940,255 980,255" fill="none" stroke="#f08c00" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="940" cy="190" r="4" fill="#f08c00"/>
<rect x="153" y="312" width="14" height="36" rx="2" fill="#fff" stroke="#495057" stroke-width="1.6"/>
<text x="172" y="334" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2833" text-anchor="start">100k</text>
<rect x="153" y="392" width="14" height="36" rx="2" fill="#fff" stroke="#495057" stroke-width="1.6"/>
<text x="172" y="414" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2833" text-anchor="start">33k</text>
<polyline points="140,240 140,290 160,290 160,312" fill="none" stroke="#e8590c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="160,348 160,392" fill="none" stroke="#2b8a3e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="160,428 160,445" fill="none" stroke="#222222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="160" y1="445" x2="160" y2="453" stroke="#222222" stroke-width="2.4"/><line x1="150" y1="453" x2="170" y2="453" stroke="#222222" stroke-width="2.4"/><line x1="154" y1="457" x2="166" y2="457" stroke="#222222" stroke-width="2.4"/><line x1="158" y1="461" x2="162" y2="461" stroke="#222222" stroke-width="2.4"/>
<polyline points="160,370 60,370" fill="none" stroke="#2b8a3e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110.0" y="364.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle">to GPIO2</text>
<circle cx="160" cy="370" r="4" fill="#2b8a3e"/>
<rect x="753" y="452" width="14" height="36" rx="2" fill="#fff" stroke="#495057" stroke-width="1.6"/>
<text x="772" y="474" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2833" text-anchor="start">100k</text>
<rect x="753" y="532" width="14" height="36" rx="2" fill="#fff" stroke="#495057" stroke-width="1.6"/>
<text x="772" y="554" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2833" text-anchor="start">100k</text>
<polyline points="615,405 615,430 760,430 760,452" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="760,488 760,532" fill="none" stroke="#2b8a3e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="760,568 760,585" fill="none" stroke="#222222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="760" y1="585" x2="760" y2="593" stroke="#222222" stroke-width="2.4"/><line x1="750" y1="593" x2="770" y2="593" stroke="#222222" stroke-width="2.4"/><line x1="754" y1="597" x2="766" y2="597" stroke="#222222" stroke-width="2.4"/><line x1="758" y1="601" x2="762" y2="601" stroke="#222222" stroke-width="2.4"/>
<polyline points="760,510 900,510" fill="none" stroke="#2b8a3e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="830.0" y="504.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle">to GPIO1 (+100 nF to GND)</text>
<circle cx="760" cy="510" r="4" fill="#2b8a3e"/>
<text x="40" y="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#495057" text-anchor="start">GPIO2 sees 6.5 V x 33/133 = 1.6 V; GPIO1 sees 4.2 V / 2 = 2.1 V</text>
<text x="40" y="537" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#495057" text-anchor="start">(both inside the 12 dB ADC range). Dividers draw about 21 uA and 49 uA.</text>
<text x="40" y="554" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#495057" text-anchor="start">Turn on "Battery / solar divider fitted" in the portal once they are wired.</text>
<text x="40" y="571" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#495057" text-anchor="start">The TDM2309 is specified from 3.8 V: below that the cell is near empty anyway.</text>
</svg>
