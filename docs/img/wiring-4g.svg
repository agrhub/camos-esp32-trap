<text x="729" y="454" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2833" text-anchor="start">VCC</text>
<polyline points="970,140 970,106" stroke="#868e96" stroke-width="2.4" fill="none"/><polyline points="958,94 970,106 982,94" stroke="#868e96" stroke-width="2.4" fill="none"/>
<text x="952" y="110" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5b6672" text-anchor="end">LTE 700-2700 MHz (IPEX or SMA)</text>
<polyline points="360,250 720,250" fill="none" stroke="#1c7ed6" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="540.0" y="244.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1c7ed6" text-anchor="middle">ESP TX -&gt; modem RXD</text>
