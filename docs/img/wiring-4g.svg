<rect x="412" y="343" width="36" height="14" rx="2" fill="#fff" stroke="#495057" stroke-width="1.6"/>
<text x="430" y="338" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2833" text-anchor="middle">1k</text>
<polyline points="360,350 412,350" fill="none" stroke="#7048e8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="520" y="326" width="48" height="48" rx="6" fill="#f3f0ff" stroke="#495057" stroke-width="1.6"/>
<text x="544" y="354" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f2833" text-anchor="middle">NPN</text>
<text x="544" y="318" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5b6672" text-anchor="middle">MMBT3904 / S8050</text>
<polyline points="448,350 520,350" fill="none" stroke="#7048e8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="484.0" y="344.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7048e8" text-anchor="middle">base</text>
<polyline points="568,350 720,350" fill="none" stroke="#7048e8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="644.0" y="344.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7048e8" text-anchor="middle">collector</text>
<polyline points="360,400 544,400 720,400" fill="none" stroke="#222222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="452.0" y="394.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#222222" text-anchor="middle">GND (also the NPN emitter)</text>
<polyline points="544,374 544,400" fill="none" stroke="#222222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="544" cy="400" r="4" fill="#222222"/>
<polyline points="140,560 640,560 640,450 720,450" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="390.0" y="554.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d62828" text-anchor="middle">BAT+ from the LiPo / charger output (not 3.3 V)</text>
<line x1="586" y1="516" x2="614" y2="516" stroke="#495057" stroke-width="2.4"/><line x1="586" y1="524" x2="614" y2="524" stroke="#495057" stroke-width="2.4"/>
<text x="620" y="524" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1f2833" text-anchor="start">1000 uF low-ESR + 100 nF</text>
<polyline points="640,505 600,505 600,516" fill="none" stroke="#d62828" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="600,524 600,538" fill="none" stroke="#222222" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="600" y1="538" x2="600" y2="546" stroke="#222222" stroke-width="2.4"/><line x1="590" y1="546" x2="610" y2="546" stroke="#222222" stroke-width="2.4"/><line x1="594" y1="550" x2="606" y2="550" stroke="#222222" stroke-width="2.4"/><line x1="598" y1="554" x2="602" y2="554" stroke="#222222" stroke-width="2.4"/>
<text x="60" y="500.0" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#495057" text-anchor="start">* SIM800L-compatible boards often have only RST (reset).</text>
<text x="60" y="516.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#495057" text-anchor="start">  The firmware pulses 1.5 s to start and uses AT+CPOF to stop.</text>
