<text x="351" y="354" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2833" text-anchor="end">GPIO47</text>
<circle cx="360" cy="400" r="4" fill="#fff" stroke="#495057" stroke-width="2"/>
<text x="351" y="404" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2833" text-anchor="end">GND</text>
<rect x="720" y="140" width="300" height="320" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/>
<text x="870.0" y="162" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2833" text-anchor="middle">A7680C TDM2309</text>
<text x="870.0" y="180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">3.8-4.2 V, 3.3 V / 5 V logic</text>
<text x="870.0" y="195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6672" text-anchor="middle">(no level shifter needed)</text>
