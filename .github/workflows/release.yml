name: release
# On a tag v* (git tag v0.4.0 && git push origin v0.4.0): build the public firmware (defaults.example.json, no secrets)
# for the Freenove ESP32-S3 CAM and the AI-Thinker ESP32-CAM, publish a GitHub Release with ready-to-flash images, and
# deploy the browser flasher (docs/flash/, ESP Web Tools) to GitHub Pages: https://<owner>.github.io/<repo>/flash/
#
#   camos-esp32-trap-<board>-v<ver>-install.bin   merged from 0x0 (bootloader, partition table, otadata, app; the gaps
#                                                 are 0xFF): a first install, it also empties the settings and identity
#   camos-esp32-trap-<board>-v<ver>-update.bin    the app alone, for 0x20000 (with -otadata.bin at 0x11000): keeps the
#   camos-esp32-trap-<board>-v<ver>-otadata.bin   settings, the serial, the verify code and the certificate
#   manifest-<board>-install.json / -update.json  ESP Web Tools manifests (also on the Pages site)
#   SHA256SUMS                                    checksums of every file above
#
# One-time repository settings: Settings > Pages > Source: GitHub Actions; Settings > Environments > github-pages >
# Deployment branches and tags: add the tag rule v* (by default only the default branch may deploy).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IDF_VERSION: v5.4.4
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - board: freenove
            target: esp32s3
            chip: ESP32-S3
            defaults: sdkconfig.defaults;sdkconfig.defaults.freenove_esp32s3_cam
            name: Freenove ESP32-S3 CAM (FNK0085)
          - board: esp32cam
            target: esp32
            chip: ESP32
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32cam
            name: AI-Thinker ESP32-CAM
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dev"; fi
          PV=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' firmware/CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$VER" != "$PV" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match PROJECT_VER $PV in firmware/CMakeLists.txt"; exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: firmware
          command: >-
            idf.py -B build-${{ matrix.board }} -DSDKCONFIG=build-${{ matrix.board }}/sdkconfig
            -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" set-target ${{ matrix.target }} build &&
            cd build-${{ matrix.board }} &&
            python -m esptool --chip ${{ matrix.target }} merge_bin -o ../install.bin @flash_args &&
            cp camos-esp32.bin ../update.bin && cp ota_data_initial.bin ../otadata.bin
      - name: package
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          set -eu
          mkdir -p dist
          P="camos-esp32-trap-${{ matrix.board }}-v$VER"
          cp firmware/install.bin "dist/$P-install.bin"
          cp firmware/update.bin "dist/$P-update.bin"
          cp firmware/otadata.bin "dist/$P-otadata.bin"
          grep -q '^CONFIG_CAMOS_WEB_BENCH_IP=""' firmware/build-${{ matrix.board }}/sdkconfig || { echo "::error::CAMOS_WEB_BENCH_IP is set"; exit 1; }
          cat > dist/manifest-${{ matrix.board }}-install.json <<EOF
          {"name":"CamOS trap camera, ${{ matrix.name }}","version":"$VER","new_install_prompt_erase":true,
           "builds":[{"chipFamily":"${{ matrix.chip }}","parts":[{"path":"$P-install.bin","offset":0}]}]}
          EOF
          cat > dist/manifest-${{ matrix.board }}-update.json <<EOF
          {"name":"CamOS trap camera, ${{ matrix.name }} (update: keeps the settings and the camera's identity)","version":"$VER","new_install_prompt_erase":false,
           "builds":[{"chipFamily":"${{ matrix.chip }}","parts":[{"path":"$P-otadata.bin","offset":69632},{"path":"$P-update.bin","offset":131072}]}]}
          EOF
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.board }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}flash/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums and notes
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dev"; fi
          (cd dist && sha256sum *.bin *.json > SHA256SUMS && cat SHA256SUMS)
          PAGES="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/flash/"
          sed -e "s|{{VERSION}}|$VER|g" -e "s|{{FLASHER}}|$PAGES|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
            .github/release-notes.md > notes.md
          { echo; echo '### SHA-256'; echo '```'; cat dist/SHA256SUMS; echo '```'; } >> notes.md
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: camos-esp32-trap ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
      - name: Pages site
        run: |
          set -eu
          mkdir -p site/flash/firmware
          cp docs/flash/index.html site/flash/
          cp dist/* site/flash/firmware/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=flash/"><a href="flash/">Flash the trap camera</a>\n' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
