<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamOS AI Camera</title>
<style>
:root{--brand:#18b693;--brand-d:#119a7b;--head:#1c2531;--head2:#252f3d;--side:#f4f6f8;--line:#dfe3e8;--fg:#1f2833;--muted:#6b7684;--bg:#e9ecef;--panel:#fff;--ok:#1a8d3f;--warn:#c27400;--bad:#d1242f}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:13px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--fg)}
button,input,select{font:inherit;color:inherit}.hidden{display:none!important}a{color:var(--brand-d)}
.logo-mark{border-radius:6px;display:block}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#1c2531 0%,#22313f 55%,#185e50 100%)}
.gate .box{width:100%;max-width:380px;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden}
.gate .top{display:flex;align-items:center;gap:12px;padding:22px 26px;border-bottom:1px solid var(--line)}
.gate .top b{display:block;font-size:17px}.gate .top span{color:var(--muted);font-size:12px}
.gate form{padding:22px 26px 26px}.gate p{color:var(--muted);margin:0 0 14px}
.gate label{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.gate input,.gate select{width:100%;height:36px;padding:0 10px;border:1px solid #cdd3da;border-radius:3px;margin-bottom:14px;background:#fff}
.gate .lang{display:flex;justify-content:flex-end;padding:10px 26px 0}.gate .lang select{width:auto;height:28px;margin:0}
header{height:52px;background:var(--head);color:#cfd6df;display:flex;align-items:center;padding:0 14px;gap:22px;position:sticky;top:0;z-index:5}
header .logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;white-space:nowrap}
header .logo small{color:#8e9aab;font-weight:400;margin-left:4px}
header nav{display:flex;height:100%}
header nav a{display:flex;align-items:center;padding:0 18px;color:#cfd6df;text-decoration:none;border-bottom:3px solid transparent;cursor:pointer}
header nav a:hover{color:#fff;background:var(--head2)}header nav a.on{color:#fff;border-bottom-color:var(--brand);background:var(--head2)}
header .right{margin-left:auto;display:flex;align-items:center;gap:14px}
header .right select{background:var(--head2);border:1px solid #3a4656;color:#dfe5ec;border-radius:3px;height:28px}
header .right button{background:none;border:1px solid #3a4656;color:#dfe5ec;border-radius:3px;height:28px;padding:0 10px;cursor:pointer}
header .user{color:#8e9aab}
.wrap{display:flex;min-height:calc(100% - 52px)}
aside{width:220px;background:var(--side);border-right:1px solid var(--line);flex-shrink:0;padding:8px 0}
aside .grp{padding:12px 16px 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
aside a{display:block;padding:7px 16px 7px 26px;color:var(--fg);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
aside a:hover{background:#e8ecef}aside a.on{background:#fff;border-left-color:var(--brand);color:var(--brand-d);font-weight:600}
main{flex:1;min-width:0;padding:18px 22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:14px}
.panel>h3{margin:0;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;background:#fafbfc}
.panel .body{padding:12px 16px}
.crumb{color:var(--muted);margin:0 0 12px;font-size:12px}.crumb b{color:var(--fg);font-size:16px;margin-right:8px}
.row{display:flex;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap}
.row>label:first-child{width:210px;color:#46505c;flex-shrink:0}
.row input[type=text],.row input[type=password],.row input[type=number],.row select{width:260px;max-width:100%;height:30px;padding:0 8px;border:1px solid #cdd3da;border-radius:3px;background:#fff}
.row input[type=range]{width:220px;accent-color:var(--brand)}
input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px;vertical-align:-3px}
.note{color:var(--muted);font-size:12px}
.actions{padding:10px 16px;border-top:1px solid var(--line);background:#fafbfc;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{height:30px;padding:0 16px;border-radius:3px;border:1px solid #c5ccd4;background:#fff;cursor:pointer}.btn:hover{border-color:#9aa4b0}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:#f1b9bd}.btn:disabled{opacity:.55;cursor:default}.gate .btn{width:100%;height:38px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:7px 12px}.kv>div:nth-child(odd){color:#46505c}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#a3acb8}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.msg{font-size:12px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
code{background:#eef1f4;padding:1px 6px;border-radius:3px;font-size:12px;word-break:break-all}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{background:#fafbfc;font-weight:600}
tr.pick{cursor:pointer}tr.pick:hover{background:#f3f7f6}tr.pick.on{background:#e3f6f1;font-weight:600}
pre.log{background:#141b23;color:#d3dbe5;padding:12px;height:60vh;overflow:auto;font:12px/1.5 Consolas,ui-monospace,monospace;margin:0;white-space:pre-wrap;word-break:break-all}
.live{display:flex;gap:14px;padding:14px;min-height:calc(100% - 52px)}
.player{flex:1;min-width:0;display:flex;flex-direction:column;background:#000;border-radius:3px;overflow:hidden}
.screen{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:300px}
.screen img{max-width:100%;max-height:calc(100vh - 150px);display:block}
.screen .osd{position:absolute;left:10px;top:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000}.screen .idle{color:#8e9aab}
.tools{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#1c2531;color:#cfd6df}
.tools button,.tools select{background:none;border:0;color:#cfd6df;height:30px;padding:0 10px;border-radius:3px;cursor:pointer}
.tools select{background:#1c2531}.tools button:hover{background:#2c3846;color:#fff}.tools button.on{color:var(--brand)}.tools .sp{flex:1}
.side{width:300px;flex-shrink:0}.side .kv{grid-template-columns:120px 1fr}
.screen .osd.r{left:auto;right:10px;text-align:right}.screen .osd b{font-weight:600}
.screen .idle{position:absolute;left:0;right:0;bottom:12px;text-align:center;padding:0 16px}
.mbadge{display:inline-block;background:var(--bad);color:#fff;border-radius:3px;padding:0 6px;margin-left:6px;font-weight:600;text-shadow:none}
.pic{position:relative;display:inline-block;line-height:0;max-width:100%}.pic img{max-width:100%}
.pic canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.player:fullscreen .screen img{max-height:100vh}
.split{display:flex;gap:14px;align-items:flex-start}.split .pvw{flex:0 0 480px;max-width:100%;position:sticky;top:66px}
.split .pvw .player{min-height:0}.split .pvw .screen{min-height:240px}.split .pvw .screen img{max-height:none;width:100%}
.split .cfg{flex:1;min-width:0}.split .row>label:first-child{width:170px}.split .row input[type=range]{width:200px}
@media (max-width:1180px){.split{display:block}.split .pvw{position:static;flex:none;max-width:640px;margin-bottom:12px}}
.row input[type=time]{height:30px;padding:0 8px;border:1px solid #cdd3da;border-radius:3px}
.bar{height:14px;background:#eef1f4;border-radius:7px;overflow:hidden;width:260px;max-width:100%;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--brand)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.meter{position:relative}.meter b{position:absolute;top:-3px;width:2px;height:20px;background:var(--bad)}
.pb{display:flex;gap:14px;padding:14px;min-height:calc(100% - 52px)}.pb .days{width:200px;flex-shrink:0}
.pb .days a{display:flex;justify-content:space-between;padding:7px 12px;border-left:3px solid transparent;cursor:pointer;color:var(--fg);text-decoration:none}
.pb .days a.on{border-left-color:var(--brand);background:#e3f6f1;font-weight:600}.pb .days a:hover{background:#f3f7f6}
.pb .main{flex:1;min-width:0}.pb .view{background:#000;display:flex;align-items:center;justify-content:center;min-height:320px;border-radius:3px 3px 0 0}
.pb .view img{max-width:100%;max-height:60vh;display:block}
.timeline{position:relative;height:34px;background:#1c2531;border-radius:0 0 3px 3px;margin-bottom:14px}
.timeline i{position:absolute;top:6px;width:2px;height:14px;background:var(--brand);cursor:pointer}.timeline i.M{background:#e5534b}.timeline i.on{background:#fff;width:3px}
.timeline span{position:absolute;bottom:1px;font-size:10px;color:#8e9aab;transform:translateX(-50%)}
.table-scroll{max-height:40vh;overflow:auto}
.claimq{display:flex;gap:12px;align-items:center}.claimq>div{min-width:0}.claimq .note{overflow-wrap:anywhere}.kv>div{min-width:0;overflow-wrap:anywhere}.claimq img{width:110px;height:110px;border:1px solid var(--line);border-radius:3px}
.badge{display:inline-block;font-size:11px;font-weight:600;color:#5b6672;background:#eef1f4;border-radius:10px;padding:1px 8px;margin-left:6px}
.badge.warn{background:#fff3df;color:#9a5b00}
@media (max-width:860px){
 header{gap:10px;padding:0 8px}header .logo span{display:none}header nav a{padding:0 10px}header .user{display:none}
 .wrap{display:block}aside{width:auto;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
 aside .grp{display:none}aside a{white-space:nowrap;padding:10px 12px;border-left:0;border-bottom:3px solid transparent}aside a.on{border-bottom-color:var(--brand)}
 main{padding:12px}.row>label:first-child{width:100%}.kv{grid-template-columns:130px 1fr}.live{display:block;padding:8px}.side{width:auto;margin-top:12px}
 .split{display:block}.split .pvw{position:static;flex:none;margin-bottom:12px}.pb{display:block;padding:8px}.pb .days{width:auto;margin-bottom:12px}
}
.dlg{position:fixed;inset:0;background:rgba(15,20,28,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.dlg .box{background:var(--panel);border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:440px;width:100%}
.dlg .txt{padding:20px 20px 8px;line-height:1.5;white-space:pre-line}.dlg .act{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px}
</style>
</head>

</div>

 </header>
 <div id="view"></div>
</div>

/* English by default; Vietnamese only when picked (remembered in this browser and on the camera, NVS uiLang) */
let lang = 'en', langSaved = false;
try { const l = localStorage.getItem('camosLang'); if (I18N[l]) { lang = l; langSaved = true; } } catch (e) { /* private mode */ }
const $ = (s) => document.querySelector(s);
const t = (k, ...a) => String(I18N[lang][k] ?? I18N.en[k] ?? k).replace(/\{(\d)\}/g, (m, i) => a[i] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const errText = (code, msg) => { const m = (I18N[lang].E || {})[code] || I18N.en.E[code]; return m ? m.replace('{0}', msg || '') : msg || code || '?'; };
async function api(path, body) {
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'camos' }, body: JSON.stringify(body) } : { cache: 'no-store' };
  const r = await fetch('/api/' + path, opt);
  let j = {}; try { j = await r.json(); } catch (e) { /* none */ }
  if (r.status === 401 && j.error === 'LOGIN_REQUIRED') { boot(); const e = new Error(errText('LOGIN_REQUIRED')); e.code = 'LOGIN_REQUIRED'; throw e; }
  if (!r.ok) { const e = new Error(errText(j.error, j.message)); e.code = j.error; throw e; }
  return j;
}
function langSelect(el) {
  el.innerHTML = ['en', 'vi'].map((l) => `<option value="${l}"${l === lang ? ' selected' : ''}>${I18N[l].lang}</option>`).join('');
  el.onchange = () => {
    lang = el.value; langSaved = true;
    try { localStorage.setItem('camosLang', lang); } catch (e) { /* private */ }
    fetch('/api/lang', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'camos' }, body: JSON.stringify({ uiLang: lang }) }).catch(() => { /* still switches */ });
    boot();
  };
}
function ask(text, opt = {}) {
  return new Promise((res) => {
    const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = `<div class="box"><div class="txt">${esc(text)}</div><div class="act"><button class="btn" data-v="0">${t('dlgCancel')}</button><button class="btn ${opt.danger ? 'danger' : 'primary'}" data-v="1">${t('dlgOk')}</button></div></div>`;
    d.onclick = (e) => { const b = e.target.closest('button'); if (b) { d.remove(); res(b.dataset.v === '1'); } };
    document.body.appendChild(d);
  });
}

/* ---------------------------------------------------------------- shell */
let timers = [];
function stopTimers() { timers.forEach((s) => s()); timers = []; }
function every(ms, fn) { let on = true, h; const loop = async () => { if (!on) return; try { await fn(); } catch (e) { /* next time */ } if (on) h = setTimeout(loop, ms); }; loop(); timers.push(() => { on = false; clearTimeout(h); }); }
let FEAT = { modem: false, gps: false };
const MENU = () => [
  ['gSystem', [['device', 'pDevice'], ['time', 'pTime'], ['maint', 'pMaint'], ['events', 'pEvents'], ['logs', 'pLogs']]],
  ['gNetwork', [['wifi', 'pWifi']].concat(FEAT.modem ? [['cell', 'pCell']] : [], [['cloud', 'pCloud']])],
  ['gImage', [['image', 'pImage']]],
  ['gEvent', [['motion', 'pMotion'], ['schedule', 'pSchedule']]],
  ['gStorage', [['storage', 'pStorage']]],

  ['gSecurity', [['account', 'pAccount']]],

function header() {

  $('#hModel').textContent = session.model || ''; langSelect($('#hLang'));
}
document.querySelector('header nav').onclick = (e) => { const a = e.target.closest('a'); if (a) location.hash = a.dataset.top === 'config' ? 'config/device' : a.dataset.top; };
$('#logoutBtn').onclick = async () => { try { await api('logout', {}); } catch (e) { /* gone */ } boot(); };
window.onhashchange = () => route();
let routing = Promise.resolve();
function route() { routing = routing.then(drawRoute, drawRoute); return routing; }
async function drawRoute() {
  stopTimers();
  const [top, page] = location.hash.slice(1).split('/');
  const isConfig = top === 'config', isPlay = top === 'playback';
  $('#tLive').classList.toggle('on', !isConfig && !isPlay); $('#tPlay').classList.toggle('on', isPlay); $('#tConfig').classList.toggle('on', isConfig);

    const groups = MENU(), pg = {}; groups.forEach(([g, items]) => items.forEach(([id, k]) => { pg[id] = [g, k]; }));
    const id = pg[page] ? page : 'device';
    view.innerHTML = `<div class="wrap"><aside>${groups.map(([g, items]) => `<div class="grp">${t(g)}</div>` + items.map(([pid, k]) => `<a data-p="${pid}" class="${pid === id ? 'on' : ''}">${t(k)}</a>`).join('')).join('')}</aside>
      <main><div class="crumb"><b>${t(pg[id][1])}</b>${t('configuration')} › ${t(pg[id][0])}</div><div id="page">${t('loading')}</div></main></div>`;
    $('aside').onclick = (e) => { const a = e.target.closest('a'); if (a) location.hash = 'config/' + a.dataset.p; };

  try { await api('config', body); if (restart) { say(msgEl, t('savedRestart'), true); if (await ask(t('askRestart'))) await doRestart(msgEl); } else say(msgEl, t('saved'), true); return true; }
  catch (err) { say(msgEl, err.message); return false; }
}
async function doRestart(msgEl) { await api('reboot', {}); say(msgEl, t('restarting'), true); await waitBack(); say(msgEl, t('back'), true); }
async function waitBack() { await new Promise((r) => setTimeout(r, 6000)); for (let i = 0; i < 60; i++) { try { const r = await fetch('/api/session', { cache: 'no-store' }); if (r.ok) return; } catch (e) { /* not yet */ } await new Promise((r) => setTimeout(r, 2000)); } }
const fmtUp = (s) => (Math.floor(s / 86400) ? t('days', Math.floor(s / 86400)) : '') + t('hm', Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60);
const fmtBatt = (b) => b ? `${(b.mv / 1000).toFixed(2)} V · ${b.pct} % · ${b.charging ? t('charging') : t('notCharging')}` : t('noBattery');
function claimPanel(st, cfg) {

/* ---------------------------------------------------------------- live picture (MJPEG /api/stream, stills as the fallback) */
const SIZES = [['320x240', 'QVGA 320×240'], ['640x480', 'VGA 640×480'], ['800x600', 'SVGA 800×600'], ['1024x768', 'XGA 1024×768'], ['1280x720', 'HD 1280×720'], ['1600x1200', 'UXGA 1600×1200']];
const QUALS = () => [['10', t('qHigh')], ['12', t('qStd')], ['20', t('qLow')]];
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAAC';
let camClockOff = 0; /* camera local time minus browser time (ms), from /api/status */
function camClock(st) { if (st && st.time && st.time.synced && st.time.local) { const [d, h] = st.time.local.split(' '); const [y, mo, da] = d.split('-').map(Number); const [hh, mi, ss] = h.split(':').map(Number); camClockOff = Date.UTC(y, mo - 1, da, hh, mi, ss) - Date.now(); } }
const camNow = () => new Date(Date.now() + camClockOff).toISOString().replace('T', ' ').slice(0, 19);
const prefs = (() => { let p = {}; try { p = JSON.parse(localStorage.getItem('camosLive') || '{}'); } catch (e) { /* private */ } return p; })();
function savePrefs() { try { localStorage.setItem('camosLive', JSON.stringify(prefs)); } catch (e) { /* private */ } }
const players = new Set();
document.addEventListener('visibilitychange', () => players.forEach((p) => (document.hidden ? p.pause() : p.resume())));

/* A live picture in `box`: start() / stop() / setSize(w, h, q); the stream closes while the tab is hidden */
function livePicture(box, opt = {}) {
  box.innerHTML = `<div class="pic"><img alt="">${opt.overlay ? '<canvas></canvas>' : ''}</div><span class="osd"><b class="clk"></b> <span class="nm"></span></span><span class="osd r"><span class="fp"></span><span class="mbadge hidden">${t('motionOsd')}</span></span><span class="idle hidden"></span>`;
  const img = box.querySelector('img'), idle = box.querySelector('.idle');
  const p = { w: opt.w || 640, h: opt.h || 480, q: opt.q || 12, on: false, wanted: false, gen: 0, timer: null, img, canvas: box.querySelector('canvas') };
  const note = (text) => { idle.textContent = text || ''; idle.classList.toggle('hidden', !text); };
  const stills = (g) => {
    let n = 0;
    const loop = async () => {
      if (g !== p.gen) return;
      if (++n % 8 === 0) { try { const s = await api('status'); if (!s.stream.active && g === p.gen) { open(); return; } } catch (e) { /* later */ } }
      try { const r = await fetch(`/api/frame.jpg?w=${p.w}&h=${p.h}`, { cache: 'no-store' }); if (r.ok && g === p.gen) { const u = URL.createObjectURL(await r.blob()); const old = img.src; img.src = u; if (old.startsWith('blob:')) URL.revokeObjectURL(old); } } catch (e) { /* next */ }
      if (g === p.gen) p.timer = setTimeout(loop, 2000);
    };
    loop();
  };
  const open = () => {
    const g = ++p.gen; clearTimeout(p.timer); p.on = true; note('');
    img.onerror = async () => { if (g !== p.gen) return; let s = {}; try { s = await api('status'); } catch (e) { /* */ } if (g !== p.gen) return; note(s.stream && s.stream.active ? t('busyViewer') : t('streamFail')); stills(g); };
    img.src = `/api/stream?w=${p.w}&h=${p.h}&q=${p.q}&t=${Date.now()}`;
  };
  const close = () => { p.gen++; clearTimeout(p.timer); p.on = false; img.onerror = null; img.src = BLANK; };
  p.start = () => { p.wanted = true; if (!document.hidden) open(); };
  p.stop = () => { p.wanted = false; close(); };
  p.pause = () => { if (p.on) close(); };
  p.resume = () => { if (p.wanted && !p.on) open(); };
  p.setSize = (w, h, q) => { p.w = w; p.h = h; p.q = q || p.q; if (p.wanted) open(); };
  p.osd = (st) => {
    box.querySelector('.clk').textContent = camNow(); box.querySelector('.nm').textContent = opt.name || '';
    if (st) {
      box.querySelector('.fp').textContent = st.stream.active && p.on ? t('streamInfo', st.stream.w, st.stream.h, st.stream.fps, (st.stream.avgBytes / 1024).toFixed(1)) : '';
      box.querySelector('.mbadge').classList.toggle('hidden', !(st.motion && st.motion.active));
    }
  };
  p.note = note;
  players.add(p);
  timers.push(() => { p.stop(); players.delete(p); });
  return p;
}
/* The picture now on screen as a JPEG download (the stream frame through a canvas; else one still) */
async function savePicture(img, w, h) {
  const name = `${session.serial || 'camos'}-${camNow().replace(/[: ]/g, '-')}.jpg`;
  const done = (blob) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); };
  if (img.naturalWidth > 1) {
    const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    try { c.getContext('2d').drawImage(img, 0, 0); const b = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.92)); if (b) return done(b); } catch (e) { /* fall back */ }
  }
  const r = await fetch(`/api/frame.jpg?w=${w}&h=${h}`, { cache: 'no-store' }); if (r.ok) done(await r.blob());
}

/* ---------------------------------------------------------------- playback (photos on the microSD card) */
const trName = (c) => t('tr' + c) === 'tr' + c ? c : t('tr' + c);
const fmtDay = (d) => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;
const fmtHms = (n) => `${n.slice(0, 2)}:${n.slice(2, 4)}:${n.slice(4, 6)}`;
async function PLAYBACK(view, st) {
  if (!FEAT.sd) { view.innerHTML = `<main>${panel(t('playback'), `<p class="note">${t('notBuilt')}</p>`)}</main>`; return; }
  const info = await api('sd');
  if (!info.present) { view.innerHTML = `<main>${panel(t('playback'), `<p class="note">${t('noCard')}</p>`)}</main>`; return; }
  const days = info.days.sort((a, b) => b.day.localeCompare(a.day));
  let day = (location.hash.split('/')[1] || (days[0] && days[0].day) || ''), files = [], cur = -1;
  view.innerHTML = `<div class="pb"><div class="days panel"><h3>${t('dayList')}</h3><div id="dl"></div></div>
    <div class="main"><div class="view" id="pv"><span class="note">${t('pickPhoto')}</span></div><div class="timeline" id="tl"></div>
    <div class="panel"><h3 id="dh"></h3><div class="body table-scroll"><table id="ft"></table></div>
    <div class="actions"><button class="btn" id="pPrev">${t('prev')}</button><button class="btn" id="pNext">${t('next')}</button><button class="btn" id="pDl">${t('download')}</button>
    <button class="btn danger" id="pDel">${t('del')}</button><span class="sp" style="flex:1"></span><button class="btn danger" id="pDelDay">${t('deleteDay')}</button><span class="msg" id="pMsg"></span></div></div></div></div>`;
  const drawDays = () => { $('#dl').innerHTML = days.length ? days.map((d) => `<a data-d="${d.day}" class="${d.day === day ? 'on' : ''}"><span>${fmtDay(d.day)}</span><span class="note">${d.files}</span></a>`).join('') : `<p class="note" style="padding:0 12px">${t('noPhotos')}</p>`; };
  const url = (f, dl) => `/api/sd/file?day=${day}&name=${encodeURIComponent(f.name)}${dl ? '&dl=1' : ''}`;
  const show = (i) => {
    if (i < 0 || i >= files.length) return; cur = i; const f = files[i];
    $('#pv').innerHTML = `<img src="${url(f)}" alt="">`;
    document.querySelectorAll('#ft tr.pick').forEach((r) => r.classList.toggle('on', +r.dataset.i === i));
    document.querySelectorAll('#tl i').forEach((x) => x.classList.toggle('on', +x.dataset.i === i));
  };
  const load = async () => {
    drawDays();
    $('#dh').textContent = day ? `${fmtDay(day)} · ${t('photos', 0)}` : '';
    files = day ? (await api('sd/files?day=' + day)).sort((a, b) => a.name.localeCompare(b.name)) : [];
    $('#dh').textContent = day ? `${fmtDay(day)} · ${t('photos', files.length)}` : '';
    $('#ft').innerHTML = files.length ? `<tr><th>${t('time')}</th><th>${t('trigger')}</th><th>${t('size')}</th></tr>` + files.map((f, i) => `<tr class="pick" data-i="${i}"><td>${fmtHms(f.name)}</td><td>${esc(trName(f.trigger))}</td><td>${Math.round(f.bytes / 1024)} KB</td></tr>`).join('') : `<tr><td class="note">${t('noPhotos')}</td></tr>`;
    const secs = (n) => +n.slice(0, 2) * 3600 + +n.slice(2, 4) * 60 + +n.slice(4, 6);
    $('#tl').innerHTML = [0, 6, 12, 18, 24].map((hh) => `<span style="left:${hh / 24 * 100}%">${String(hh).padStart(2, '0')}:00</span>`).join('') + files.map((f, i) => `<i class="${f.trigger}" data-i="${i}" style="left:${secs(f.name) / 864}%" title="${fmtHms(f.name)}"></i>`).join('');
    cur = -1; $('#pv').innerHTML = `<span class="note">${t(files.length ? 'pickPhoto' : 'noPhotos')}</span>`;

  $('#pDel').onclick = async () => {
    if (cur < 0) return; const f = files[cur];
    if (!(await ask(t('confirmDelete', `${fmtDay(day)} ${fmtHms(f.name)}`), { danger: true }))) return;
    try { await api('sd/delete', { day, name: f.name }); const d = days.find((x) => x.day === day); if (d) d.files--; await load(); } catch (err) { say($('#pMsg'), err.message); }

    const list = s.items.map((i) => `<tr><td>${esc(i.id)}</td><td>${i.from} – ${i.to}</td><td>${t('every', i.everyMin)}</td></tr>`).join('');
    el.innerHTML = panel(t('pSchedule'), row(t('setBy'), `<b>${cloud ? t('srcCloud') : t('srcLocal')}</b>`) + row(t('powerMode'), esc(s.powerEffective))
        + `<table>${list}</table>` + (cloud ? `<p class="note">${t('schedCloudNote')}</p>` : ''))
      + (cloud ? '' : panel(t('srcLocal'), row(t('interval'), num('sInt', s.intervalMin, 1, 1440)) + row(t('window'), `${t('from')} <input type="time" id="sFrom" value="${hm(s.schedFrom)}"> ${t('to')} <input type="time" id="sTo" value="${hm(s.schedTo)}">`, t('allDay'))
        + `<p class="note">${t('schedNote')}</p>`, saveBar('sSave')))
      + panel(t('nextCaptures'), s.clockSynced ? (s.next.length ? `<table>${s.next.map((n) => `<tr><td>${esc(n.at)}</td><td class="note">${esc(n.id)}</td></tr>`).join('')}</table>` : t('none')) + (s.nextWakeAt ? `<p class="note">nextWakeAt (FlyBot): ${esc(s.nextWakeAt)}</p>` : '') : `<p class="note">${t('noClock')}</p>`);
    if (!cloud) $('#sSave').onclick = async () => { if (await saveCfg({ intervalMin: +$('#sInt').value, schedFrom: mins($('#sFrom').value || '00:00'), schedTo: mins($('#sTo').value || '23:59') }, $('#sSaveMsg'))) setTimeout(() => route(), 800); };
  },

  async storage(el) {
    if (!FEAT.sd) { el.innerHTML = panel('', `<p class="note">${t('notBuilt')}</p>`); return; }
    const s = await api('sd');
    const used = s.totalMB ? s.totalMB - s.freeMB : 0, pct = s.totalMB ? Math.round(used * 100 / s.totalMB) : 0;
    el.innerHTML = panel(t('card'), s.present ? kv([[t('card'), `${dot('ok')}${esc(s.card)}`], [t('capacity'), `${s.totalMB} MB`], [t('used'), `<span class="bar"><i class="${pct > 90 ? 'bad' : pct > 75 ? 'warn' : ''}" style="width:${pct}%"></i></span> ${used} MB (${pct} %)`], [t('free'), `${s.freeMB} MB`],
        [t('playback'), `<a href="#playback">${t('photos', s.days.reduce((n, d) => n + d.files, 0))}</a>`]]) : `<p class="note">${t('noCard')}</p>`,
        s.present ? `<button class="btn danger" id="sdFmt">${t('format')}</button><span class="msg" id="sdFmtMsg"></span>` : '')
      + panel(t('pStorage'), row(t('sdSave'), chk('sdSave', s.save)) + `<p class="note">${t('storageNote')}</p>`, saveBar('sdS'));
    $('#sdS').onclick = () => saveCfg({ sdSave: $('#sdSave').checked }, $('#sdSMsg'));
    if (s.present) $('#sdFmt').onclick = async () => { if (!(await ask(t('confirmFormat'), { danger: true }))) return; say($('#sdFmtMsg'), t('loading'), true); try { await api('sd/format', {}); say($('#sdFmtMsg'), t('formatted'), true); setTimeout(() => route(), 800); } catch (err) { say($('#sdFmtMsg'), err.message); } };
  },

  async power(el, st) {
    const cfg = await api('config');
    el.innerHTML = panel(t('battery'), kv([[t('battery'), esc(fmtBatt(st.battery))], [t('solar'), st.battery && st.battery.solarMv !== undefined ? st.battery.solarMv + ' mV' : t('none')], [t('effective'), esc(st.power.effective)], [t('nextCapture'), esc(st.nextCaptureAt || t('none'))]]))
      + panel(t('pPower'), row(t('powerMode'), sel('pMode', cfg.powerMode, [['auto', 'auto'], ['battery', 'battery'], ['powered', 'powered']]), badge(cfg, 'powerMode'))
        + row(t('interval'), num('pInt', cfg.intervalMin, 1, 1440), badge(cfg, 'intervalMin')) + row(t('led'), chk('pLed', cfg.ledEnabled), badge(cfg, 'ledEnabled'))
        + row(t('battMon'), chk('pBatt', cfg.batteryMonitor), badge(cfg, 'batteryMonitor'))
        + row(t('highMv'), `<b>${st.power.highMv}</b>`) + row(t('lowMv'), `<b>${st.power.lowMv}</b>`) + `<p class="note">${t('powerNote')}</p>`, saveBar('pSave'));
    $('#pSave').onclick = () => saveCfg({ powerMode: $('#pMode').value, intervalMin: +$('#pInt').value, ledEnabled: $('#pLed').checked, batteryMonitor: $('#pBatt').checked }, $('#pSaveMsg'));
  },

  async gps(el, st) {
    const cfg = await api('config');
    const draw = (s) => kv([[t('location'), s.location ? `<a href="https://www.openstreetmap.org/?mlat=${s.location.lat}&mlon=${s.location.lng}#map=17/${s.location.lat}/${s.location.lng}" target="_blank" rel="noopener">${s.location.lat}, ${s.location.lng}</a>` : t('noFix')], [t('fixAt'), esc(s.location ? s.location.fixAt : t('none'))]]);
    el.innerHTML = panel(t('pGps'), `<div id="gKv">${draw(st)}</div>` + row(t('on'), chk('gOn', cfg.gps), badge(cfg, 'gps')) + `<p class="note">${t('gpsNote')}</p>`,
      `<button class="btn primary" id="gFix">${t('gpsFix')}</button>${saveBar('gSave')}`);
    $('#gFix').onclick = async () => { try { await api('gps', {}); say($('#gSaveMsg'), t('gpsFixing'), true); every(5000, async () => { $('#gKv').innerHTML = draw(await api('status')); }); } catch (err) { say($('#gSaveMsg'), err.message); } };
    $('#gSave').onclick = () => saveCfg({ gps: $('#gOn').checked }, $('#gSaveMsg'));
  },

  async account(el) {
    el.innerHTML = panel(t('changePw'), row(t('curPw'), '<input type="password" id="aCur">') + row(t('newPw'), '<input type="password" id="aNew">') + row(t('againPw'), '<input type="password" id="aNew2">') + `<p class="note">${t('forgot')}</p>`, saveBar('aSave'));
    $('#aSave').onclick = async () => {
      if ($('#aNew').value !== $('#aNew2').value) return say($('#aSaveMsg'), t('pwMismatch'));
      try { await api('password', { current: $('#aCur').value, new: $('#aNew').value }); say($('#aSaveMsg'), t('pwChanged'), true); } catch (err) { say($('#aSaveMsg'), err.message); }
    };
  },
};
boot();
</script>
</body>
</html>
