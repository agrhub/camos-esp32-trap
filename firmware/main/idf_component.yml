dependencies:
  idf: ">=5.3"
  # esp32-camera 2.1.8 with one addition (vendor/esp32-camera/CAMOS.md): esp_camera_set_dma_buffer, a static DMA buffer
  espressif/esp32-camera:
    version: "^2.0.0"
    override_path: "../vendor/esp32-camera"
  # 4G: SIMCom A7680C over PPP (A76xx AT set, SIM7600 DCE profile). Built into both targets; used when CAMOS_MODEM is on.
  espressif/esp_modem: "^1.4.0"
  # Status LED: WS2812 on the Freenove board (GPIO48), RMT backend
  espressif/led_strip: "^3.0.0"
  # Claim QR as SVG on the portal and console pages (Nayuki qrcodegen)
  espressif/qrcode: "^0.2.0"
  # Local name flybot-<serial tail>.local for the web console (hostname.c)
  espressif/mdns: "^1.4.0"
  # Live view over KVS WebRTC (live_kvs.c, CAMOS_LIVE, ESP32-S3 only): PeerConnection (ICE, DTLS-SRTP, RTP),
  # software H.264 encoder, WebSocket client for the KVS signaling channel
  espressif/esp_peer:
    version: "~1.5.7"
    rules:
      - if: "target == esp32s3"
  espressif/esp_h264:
    version: "~1.4.1"
    rules:
      - if: "target == esp32s3"
  espressif/esp_websocket_client:
    version: "~1.7.0"
    rules:
      - if: "target == esp32s3"
  # Native USB port as a UVC webcam or a microSD card reader (usbdev.c, CAMOS_USB_OTG, ESP32-S3 only); our own
  # tusb_config.h and descriptors (main/usb/), the same TinyUSB as espressif/usb_device_uvc 1.3.1
  espressif/tinyusb:
    version: "^0.19.0~3"
    rules:
      - if: "target == esp32s3"
  # A USB stick on the native USB port as the photo storage (usbhost.c, host mode, ESP32-S3 only)
  espressif/usb_host_msc:
    version: "^1.3.0"
    rules:
      - if: "target == esp32s3"
